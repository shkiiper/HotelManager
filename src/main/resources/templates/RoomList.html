<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Список комнат</title>
    <style>
        body { font-family: Arial, sans-serif; }
        table { width: 80%; margin: 20px auto; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f4f4f4; }
        a { text-decoration: none; color: #007BFF; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<h1 style="text-align: center;">Список комнат</h1>
<table>
    <thead>
    <tr>
        <th>Номер</th>
        <th>Тип</th>
        <th>Цена</th>
        <th>Статус</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="room : ${rooms}">
        <td th:text="${room.number}"></td>
        <td th:text="${room.type}"></td>
        <td th:text="${room.price}"></td>
        <td th:text="${room.available ? 'Доступно' : 'Недоступно'}"></td>
        <td>
            <a th:href="@{/rooms/{id}(id=${room.id})}">Просмотр</a> |
            <a th:href="@{/rooms/{id}/edit(id=${room.id})}">Редактировать</a> |
            <form th:action="@{/rooms/{id}/delete(id=${room.id})}" method="post" style="display: inline;">
                <button type="submit" style="color: red; background: none; border: none; cursor: pointer;">Удалить</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
<div style="text-align: center; margin-top: 20px;">
    <a href="/rooms/new" style="padding: 10px 15px; background-color: #28a745; color: white; border-radius: 5px;">Добавить новую комнату</a>
</div>
</body>
</html>
